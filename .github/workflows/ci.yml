name: CI

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
        run: pytest

      - name: Build image
        run: docker build -t orders-api:${{ github.sha }} .

      - name: Log in to registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: myregistry.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag orders-api:${{ github.sha }} myregistry.io/orders-api:${{ github.sha }}
          docker tag orders-api:${{ github.sha }} myregistry.io/orders-api:latest
          docker push myregistry.io/orders-api:${{ github.sha }}
          docker push myregistry.io/orders-api:latest
